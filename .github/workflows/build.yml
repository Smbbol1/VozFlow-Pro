name: Compilar APK (Manual ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar APK Debug (solo arm64-v8a)
        run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Firmar APK para instalación
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          $APKSIGNER sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out VozFlow-Pro-arm64.apk app/build/intermediates/apk/debug/app-debug.apk

      - name: Subir APK en ZIP para descarga
        uses: actions/upload-artifact@v4
        with:
          name: VozFlow-Pro-arm64
          path: VozFlow-Pro-arm64.apk
