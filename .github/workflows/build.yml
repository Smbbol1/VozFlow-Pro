name: Compilar APK (Manual ARM64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Preparar y firmar APK final
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk VozFlow-Pro.apk
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
            $BUILD_TOOLS/zipalign -p -f -v 4 app/build/intermediates/apk/debug/app-debug.apk aligned.apk
            $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out VozFlow-Pro.apk aligned.apk
          fi

      - name: Subir APK en ZIP para descarga
        uses: actions/upload-artifact@v4
        with:
          name: VozFlow-Pro-APK
          path: VozFlow-Pro.apk
